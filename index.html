    if (asleep) drawZ(s.x + r * 0.9, s.y - r * 1.3);
    // warning bars for whichever need is in trouble
    let bar = 0;
    if (s.warmth < 60) bar = drawNeedBar(s, bar, s.warmth, "#6cb2eb");
    if (s.hunger < 45) bar = drawNeedBar(s, bar, s.hunger, "#e2b04a");
    if (s.stamina < 30) bar = drawNeedBar(s, bar, s.stamina, "#b58ee0");
    if (s.health < 85) bar = drawNeedBar(s, bar, s.health, "#e8775a");
  }
}

function drawNeedBar(s, slot, value, color) {
  const w = TILE * 0.8, h = 2.6;
  const x = s.x - w / 2, y = s.y - TILE * 0.62 - slot * (h + 1.6);
  ctx.fillStyle = "rgba(10,12,16,0.65)";
  ctx.fillRect(x - 0.5, y - 0.5, w + 1, h + 1);
  ctx.fillStyle = color;
  ctx.fillRect(x, y, w * clamp(value / CFG.NEED_MAX, 0, 1), h);
  return slot + 1;
}

function drawZ(x, y) {
  ctx.fillStyle = "rgba(232, 236, 241, 0.85)";
  ctx.font = "bold 10px system-ui, sans-serif";
  const f = (animT * 1.3) % 1;
  ctx.globalAlpha = 1 - f;
  ctx.fillText("z", x + f * 4, y - f * 7);
  ctx.globalAlpha = 1;
}

// Darkness at night, with the light of every burning campfire punched out of it.
function drawNight() {
  const n = nightFactor();
  if (n <= 0.02) return;
  const W = canvas.width, H = canvas.height;
  if (lightCanvas.width !== W) { lightCanvas.width = W; lightCanvas.height = H; }
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  lctx.clearRect(0, 0, W, H);
  lctx.fillStyle = "rgba(8, 11, 24, " + (0.76 * n).toFixed(3) + ")";
  lctx.fillRect(0, 0, W, H);
  // the pools of firelight are punched out in world coordinates, so they stay
  // over the right tiles however far the view is zoomed in
  lctx.globalCompositeOperation = "destination-out";
  applyCamTransform(lctx);
  for (const fi of fireIdx) {
    if (!fireLit(fi)) continue;
    const flick = 0.92 + 0.08 * Math.sin(animT * 7 + fi);
    const r = CFG.FIRE_LIGHT * TILE * flick;
    const g = lctx.createRadialGradient(cx(fi), cy(fi), TILE * 0.4, cx(fi), cy(fi), r);
    g.addColorStop(0, "rgba(0,0,0,1)");
    g.addColorStop(0.45, "rgba(0,0,0,0.72)");
    g.addColorStop(1, "rgba(0,0,0,0)");
    lctx.fillStyle = g;
    lctx.beginPath();
    lctx.arc(cx(fi), cy(fi), r, 0, Math.PI * 2);
    lctx.fill();
  }
  lctx.setTransform(1, 0, 0, 1, 0, 0);
  lctx.globalCompositeOperation = "source-over";
  inScreenSpace(() => ctx.drawImage(lightCanvas, 0, 0));

  // warm glow on top so firelight actually looks warm
  ctx.save();
  ctx.globalCompositeOperation = "lighter";
  for (const fi of fireIdx) {
    if (!fireLit(fi)) continue;
    const r = CFG.FIRE_LIGHT * TILE * 0.8;
    const g = ctx.createRadialGradient(cx(fi), cy(fi), 0, cx(fi), cy(fi), r);
    g.addColorStop(0, "rgba(255, 170, 80, " + (0.30 * n).toFixed(3) + ")");
    g.addColorStop(1, "rgba(255, 140, 60, 0)");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx(fi), cy(fi), r, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();
}

function drawTempOverlay() {
  forVisibleTiles((i, px, py) => {
    const t = localTemp(cx(i), cy(i));
    const f = clamp((t + 20) / 55, 0, 1);      // -20C .. +35C
    const r = Math.round(lerp(60, 240, f));
    const g = Math.round(lerp(120, 130, 1 - Math.abs(f - 0.5) * 2));
    const b = Math.round(lerp(240, 60, f));
    ctx.fillStyle = "rgba(" + r + "," + g + "," + b + ",0.42)";
    ctx.fillRect(px, py, TILE, TILE);
  });
  inScreenSpace(() => {
    ctx.fillStyle = "rgba(232,236,241,0.9)";
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillText("Temperature — blue is deadly cold, orange is comfortable", 10, canvas.height - 12);
  });
}

function drawRoomOverlay() {
  forVisibleTiles((i, px, py) => {
    const t = tiles[i];
    if (t.room < 0 || !rooms[t.room]) return;
    const r = rooms[t.room];
    const f = clamp((r.insul - CFG.INDOOR_WARMTH_MIN) /
                    (CFG.INDOOR_WARMTH_MAX - CFG.INDOOR_WARMTH_MIN), 0, 1);
    ctx.fillStyle = "rgba(" + Math.round(lerp(159, 108, f)) + ", 230, " + Math.round(lerp(176, 235, f)) + ", 0.26)";
    ctx.fillRect(px, py, TILE, TILE);
  });
  inScreenSpace(() => {
    ctx.fillStyle = "rgba(232,236,241,0.9)";
    ctx.font = "600 12px system-ui, sans-serif";
    ctx.fillText("Enclosed rooms — stone walls hold in more heat", 10, canvas.height - 12);
  });
}

function drawPaintPreview() {
  if (drag) {
    const ax = Math.min(drag.x0, drag.x1), bx = Math.max(drag.x0, drag.x1);
    const ay = Math.min(drag.y0, drag.y1), by = Math.max(drag.y0, drag.y1);
    ctx.strokeStyle = tool === "cancel" ? "rgba(232, 119, 90, 0.95)" : "rgba(159, 230, 176, 0.95)";
    ctx.lineWidth = 2 / cam.z;
    ctx.setLineDash([5 / cam.z, 4 / cam.z]);
    ctx.strokeRect(ax * TILE + 1, ay * TILE + 1, (bx - ax + 1) * TILE - 2, (by - ay + 1) * TILE - 2);
    ctx.setLineDash([]);
  } else if (hover.tx >= 0 && tool !== "info") {
    ctx.strokeStyle = "rgba(232, 236, 241, 0.5)";
    ctx.lineWidth = 1.5 / cam.z;
    ctx.strokeRect(hover.tx * TILE + 1, hover.ty * TILE + 1, TILE - 2, TILE - 2);
  }
}

function drawSelectionRing() {
  if (!selection) return;
  if (selection.kind === "settler") {
    const s = settlers.find(x => x.id === selection.id);
    if (!s) return;
    ctx.strokeStyle = "#9fe6b0";
    ctx.lineWidth = 2 / cam.z;
    ctx.beginPath();
    ctx.arc(s.x, s.y, TILE * 0.52, 0, Math.PI * 2);
    ctx.stroke();
    if (s.path && s.path.length) {
      ctx.strokeStyle = "rgba(159, 230, 176, 0.45)";
      ctx.lineWidth = 1.5 / cam.z;
      ctx.setLineDash([3 / cam.z, 3 / cam.z]);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y);
      for (const i of s.path) ctx.lineTo(cx(i), cy(i));
      ctx.stroke();
      ctx.setLineDash([]);
    }
  } else {
    const i = selection.i;
    ctx.strokeStyle = "#9fe6b0";
    ctx.lineWidth = 2 / cam.z;
    ctx.strokeRect(txOf(i) * TILE + 1, tyOf(i) * TILE + 1, TILE - 2, TILE - 2);
  }
}

function buildPalette() {
  const work = document.getElementById("toolsWork");
  const build = document.getElementById("toolsBuild");
  const view = document.getElementById("toolsView");
  for (const t of TOOLS) {
    const b = document.createElement("button");
    b.dataset.tool = t.id;
    b.innerHTML = '<span class="hot">' + t.hot + "</span>" + t.label;
    b.addEventListener("click", () => setTool(t.id));
    (t.group === "work" ? work : build).appendChild(b);
  }
  const mk = (label, hot, onClick, id) => {
    const b = document.createElement("button");
    b.id = id;
    b.innerHTML = '<span class="hot">' + hot + "</span>" + label;
    b.addEventListener("click", onClick);
    view.appendChild(b);
    return b;
  };
  mk("Temperature", "T", () => { showTemp = !showTemp; showRooms = false; syncPalette(); }, "btnTemp");
  mk("Rooms", "R", () => { showRooms = !showRooms; showTemp = false; syncPalette(); }, "btnRooms");
  syncPalette();
}

function setTool(id) {
  tool = id;
  if (id !== "info") selection = null;
  syncPalette();
}

function syncPalette() {
  document.querySelectorAll("[data-tool]").forEach(b => {
    const id = b.dataset.tool;
    b.classList.toggle("active", id === tool);
    if (id.startsWith("bld:")) {
      b.classList.toggle("poor", !affordable(BLD[id.slice(4)].cost));
    }
  });
  const bt = document.getElementById("btnTemp"), br = document.getElementById("btnRooms");
  if (bt) bt.classList.toggle("active", showTemp);
  if (br) br.classList.toggle("active", showRooms);

  const tip = document.getElementById("tip");
  if (tool.startsWith("bld:")) {
    const kind = tool.slice(4);
    tip.innerHTML = "<b>" + BLD[kind].name + "</b> — " + costText(BLD[kind].cost) + ".<br>" +
                    (TOOL_TIPS[tool] || "");
  } else {
    const t = TOOLS.find(x => x.id === tool);
    tip.innerHTML = t ? t.tip : "";

}

function needRow(label, value, color) {
  return '<div class="needrow"><span class="nl">' + label + '</span>' +
         '<span class="bar"><i style="width:' + clamp(value, 0, 100).toFixed(0) + '%;background:' + color + '"></i></span>' +
         '<span class="nv">' + Math.round(value) + "</span></div>";
}

function actLabel(s) {
  if (!s.act || s.act === "idle") return "looking for work";
  if (s.act === "sleep") return (s.path && s.path.length === 0) ? "asleep" : "heading to bed";
  if (s.act === "eat") return (s.path && s.path.length === 0) ? "eating" : "going to eat";
  if (s.act === "warm") return (s.path && s.path.length === 0) ? "warming up" : "looking for heat";
  if (s.act === "deliver") return s.carrying ? "hauling " + s.carrying.kind + " to a stockpile" : "hauling";
  if (s.act === "work" && s.job) {
    const j = s.job;
    const names = { chop: "felling a tree", mine: "breaking rock", gather: "gathering",
                    harvest: "harvesting a plot", build: "building " + (tiles[j.i].bp ? BLD[tiles[j.i].bp.kind].name.toLowerCase() : "something"),
                    decon: "tearing down", haul: "picking up a pile", refuel: "feeding the fire", cook: "cooking" };
    const label = names[j.kind] || j.kind;
    if (s.path && s.path.length) return "walking to " + label;
    const total = jobWork(j.kind, j.i);
    return label + " (" + Math.min(99, Math.round(s.prog / total * 100)) + "%)";
  }
  return s.act;
}

function updateSelectionPanel() {
  const el = document.getElementById("selBody");
  if (!selection) {
    el.innerHTML = '<span class="sub">Nothing selected. With the Info tool, click a settler or any tile.</span>';
    return;
  }
  if (selection.kind === "settler") {
    const s = settlers.find(x => x.id === selection.id);
    if (!s) { selection = null; return; }
    const t = Math.round(localTemp(s.x, s.y));
    el.innerHTML =
      '<div class="nm">' + s.name + '</div>' +
      '<div class="sub">' + actLabel(s) + '</div>' +
      needRow("Food", s.hunger, "#e2b04a") +
      needRow("Rest", s.stamina, "#b58ee0") +
      needRow("Warmth", s.warmth, "#6cb2eb") +
      needRow("Health", s.health, "#e8775a") +
      '<div class="sub" style="margin-top:6px">Standing in ' + t + '°' +
      (tiles[settlerTile(s)].room >= 0 ? " (indoors)" : " (outdoors)") + '</div>' +
      '<div class="sub">' + (s.bed >= 0 ? "Has a bed" : "No bed yet") +
      (s.carrying ? " · carrying " + s.carrying.amount + " " + s.carrying.kind : "") + '</div>';
    return;
  }

  const i = selection.i;
  const t = tiles[i];
  const bits = [];
  bits.push('<div class="nm">' + (t.bld ? BLD[t.bld.kind].name : t.obj ? OBJ[t.obj.kind].name : t.terrain[0].toUpperCase() + t.terrain.slice(1)) + '</div>');
  bits.push('<div class="sub">' + txOf(i) + ", " + tyOf(i) + " · " + Math.round(localTemp(cx(i), cy(i))) + '° · ' +
            (t.room >= 0 ? "indoors, holds +" + rooms[t.room].insul.toFixed(0) + "°" : "outdoors") + '</div>');
  if (t.bld && t.bld.kind === "fire") {
    bits.push(needRow("Fuel", (t.bld.fuel / CFG.FIRE_FUEL_MAX) * 100, "#e8773a"));
    if (t.bld.fuel <= 0) bits.push('<div class="sub">Out of fuel — needs wood in a stockpile.</div>');
  }
  if (t.bld && t.bld.kind === "farm") {
    bits.push(needRow("Growth", (t.bld.growth || 0) * 100, "#6fa35c"));
  }
  if (t.bld && t.bld.kind === "bed") {
    const owner = settlers.find(x => x.id === t.bld.owner);
    bits.push('<div class="sub">' + (owner ? owner.name + "'s bed" : "Unclaimed bed") + '</div>');
  }
  if (t.obj) {
    bits.push('<div class="sub">' + (t.obj.amount > 0
      ? "Yields " + t.obj.amount + " " + OBJ[t.obj.kind].res
      : "Regrowing — " + Math.ceil(t.obj.regrow) + "s") + '</div>');
  }
  if (t.bp) bits.push('<div class="sub">Blueprint: ' + BLD[t.bp.kind].name + " (" + costText(BLD[t.bp.kind].cost) + ")</div>");
  if (t.pile) bits.push('<div class="sub">Loose pile: ' + t.pile.amount + " " + t.pile.kind + "</div>");
  if (t.order) bits.push('<div class="sub">Ordered: ' + t.order + "</div>");
  if (t.decon) bits.push('<div class="sub">Marked for tear-down</div>');
  el.innerHTML = bits.join("");
}

// ===================== INPUT =====================
// Where the pointer is in canvas pixels (the canvas is CSS-scaled to fit).
function canvasPoint(ev) {
  const r = canvas.getBoundingClientRect();
  return {
    sx: (ev.clientX - r.left) * (canvas.width / r.width),
    sy: (ev.clientY - r.top) * (canvas.height / r.height),
  };
}

// ...and the world point and tile that sits under it at the current zoom.
function canvasTile(ev) {
  const s = canvasPoint(ev);
  const px = s.sx / cam.z + cam.x;
  const py = s.sy / cam.z + cam.y;
  return { sx: s.sx, sy: s.sy, px, py, tx: Math.floor(px / TILE), ty: Math.floor(py / TILE) };
}

// Mouse wheel zooms around the cursor.
canvas.addEventListener("wheel", (ev) => {
  ev.preventDefault();
  const p = canvasTile(ev);
  const unit = ev.deltaMode === 1 ? 16 : (ev.deltaMode === 2 ? 400 : 1);   // lines / pages / pixels
  zoomTo(cam.z * Math.exp(-ev.deltaY * unit * CFG.ZOOM_WHEEL), p.px, p.py, p.sx, p.sy);
}, { passive: false });

canvas.addEventListener("pointerdown", (ev) => {
  if (ev.button === 1) {                       // middle button drags the view
    ev.preventDefault();
    const s = canvasPoint(ev);
    pan = { sx: s.sx, sy: s.sy, camx: cam.x, camy: cam.y };
    canvas.setPointerCapture(ev.pointerId);
    return;
  }
  const p = canvasTile(ev);
  if (!inBounds(p.tx, p.ty)) return;
  canvas.setPointerCapture(ev.pointerId);
  if (tool === "info") {
    let best = null, bestD = TILE * 0.9 / cam.z;   // same click slack on screen at any zoom
    for (const s of settlers) {
      const d = dist(s.x, s.y, p.px, p.py);
      if (d < bestD) { bestD = d; best = s; }
    }
    selection = best ? { kind: "settler", id: best.id } : { kind: "tile", i: idx(p.tx, p.ty) };
    return;
  }
  drag = { x0: p.tx, y0: p.ty, x1: p.tx, y1: p.ty };
});

canvas.addEventListener("pointermove", (ev) => {
  if (pan) {
    const s = canvasPoint(ev);
    cam.x = pan.camx - (s.sx - pan.sx) / cam.z;
    cam.y = pan.camy - (s.sy - pan.sy) / cam.z;
    clampCam();
    return;
  }
  const p = canvasTile(ev);
  hover.tx = inBounds(p.tx, p.ty) ? p.tx : -1;
  hover.ty = p.ty;
  if (drag && inBounds(p.tx, p.ty)) { drag.x1 = p.tx; drag.y1 = p.ty; }
});

canvas.addEventListener("pointerup", () => {
  if (pan) { pan = null; saveState(); return; }
  if (drag) {
    applyTool(drag.x0, drag.y0, drag.x1, drag.y1);
    drag = null;
    hudDirty = true;
    saveState();
  }
});

canvas.addEventListener("pointercancel", () => { pan = null; drag = null; });
canvas.addEventListener("pointerleave", () => { hover.tx = -1; });
canvas.addEventListener("contextmenu", (ev) => { ev.preventDefault(); setTool("info"); });
// keep the middle button for panning instead of the browser's autoscroll
canvas.addEventListener("mousedown", (ev) => { if (ev.button === 1) ev.preventDefault(); });
canvas.addEventListener("auxclick", (ev) => { if (ev.button === 1) ev.preventDefault(); });

document.addEventListener("keydown", (ev) => {
  if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
  const k = ev.key.toLowerCase();
  if (k === " ") {
    ev.preventDefault();
    setSpeed(speed === 0 ? 1 : 0);
    return;
  }
  if (k === "escape") { setTool("info"); return; }
  if (k === "arrowleft")  { ev.preventDefault(); panCam(-CFG.PAN_KEY, 0); return; }
  if (k === "arrowright") { ev.preventDefault(); panCam(CFG.PAN_KEY, 0); return; }
  if (k === "arrowup")    { ev.preventDefault(); panCam(0, -CFG.PAN_KEY); return; }
  if (k === "arrowdown")  { ev.preventDefault(); panCam(0, CFG.PAN_KEY); return; }
  if (k === "0") { resetCam(); saveState(); return; }
  if (k === "t") { showTemp = !showTemp; showRooms = false; syncPalette(); return; }
  if (k === "r") { showRooms = !showRooms; showTemp = false; syncPalette(); return; }
  const t = TOOLS.find(x => x.hot.toLowerCase() === k);
  if (t) { setTool(t.id); return; }
  if (k === "+" || k === "=") { setSpeed(Math.min(4, (speed || 1) * 2)); }
  if (k === "-") { setSpeed(Math.max(1, (speed || 1) / 2)); }
});

function setSpeed(v) {
  speed = v;
  document.querySelectorAll(".speeds button").forEach(b =>

}

// ===================== SIM LOOP =====================
function simulate(dt) {
  if (indexDirty) reindex();
  if (roomsDirty) recomputeRooms();

  dayTimer += dt;
  while (dayTimer >= CFG.DAY_LENGTH) {
    dayTimer -= CFG.DAY_LENGTH;
    endOfDay();
  }

  jobTimer += dt;
  if (jobTimer >= CFG.JOB_REFRESH) { jobTimer = 0; refreshJobs(); }

  pathBudget = CFG.PATH_BUDGET;
  updateWorld(dt);
  updateSettlers(dt);

  msTimer += dt;
  if (msTimer >= CFG.MILESTONE_CHECK) { msTimer = 0; checkMilestones(); }

  alertTimer += dt;
  if (alertTimer >= CFG.ALERT_EVERY) { alertTimer = 0; checkAlerts(); }

  if (indexDirty) reindex();
  if (roomsDirty) recomputeRooms();
}

let last = null;
let saveAccum = 0;
let hudAccum = 0;

function frame(now) {
  if (last === null) last = now;
  let dt = (now - last) / 1000;
  last = now;
  if (dt > 0.1) dt = 0.1;      // clamp big gaps (tab switches) so nothing teleports
  animT += dt;

  saveAccum += dt;
  if (saveAccum >= 2) { saveAccum = 0; saveState(); }

  if (running && speed > 0 && settlers.length > 0) {
    let remaining = dt * speed;
    while (remaining > 0) {
      const step = Math.min(0.25, remaining);   // keep each sim step small
      simulate(step);
      remaining -= step;
    }
    if (settlers.length === 0) {
      running = false;
      addLog("The last settler is gone.", "bad");
      showOverlay();
      saveState();
    }
  }

  draw();
  hudAccum += dt;
  if (hudAccum >= 0.12) { hudAccum = 0; updateHUD(); }
  requestAnimationFrame(frame);
}

// ===================== SELF-TEST =====================
// Opened as index.html?selftest=1 - exercises the systems that are hard to eyeball.
function testWorld() {
  tiles = new Array(NTILES);
  for (let i = 0; i < NTILES; i++) {
    const t = makeTile("grass");
    t.shade = 0.3;
    tiles[i] = t;
  }
  settlers = []; jobs = []; rooms = []; log = [];
  res = { wood: 0, stone: 0, fiber: 0, food: 0, meal: 0 };
  day = 1; dayTimer = CFG.DAY_LENGTH * 0.25; speed = 1; running = true; animT = 0;
  nextId = 1; nameCursor = 0; peakPop = 0; deaths = 0; treeCount = 0;
  jobTimer = 0; msTimer = 0; sproutTimer = 0; alertTimer = 0;
  alerts = {};
  milestones = makeMilestones();
  selection = null;
  reindex();
  recomputeRooms();
}

function testSpawn(tx, ty) {
  const s = makeSettler(idx(tx, ty), false);
  settlers.push(s);
  return s;
}

// Run the colony for a while, stopping as soon as `done` is true. This drives
// the same path the real loop does (needs, then decisions, then the action), so
// a test exercises exactly what the game runs.
function runSteps(steps, dt, done) {
  for (let k = 0; k < steps; k++) {
    if (indexDirty) reindex();
    if (roomsDirty) recomputeRooms();
    pathBudget = CFG.PATH_BUDGET;
    refreshJobs();
    updateSettlers(dt);
    if (indexDirty) reindex();
    if (roomsDirty) recomputeRooms();
    if (done && done()) return k;
  }
  return -1;
}

  const near = (a, b, eps) => Math.abs(a - b) <= (eps === undefined ? 0.001 : eps);

    })());
    ok("the whole map stays reachable by panning", (() => {
      zoomTo(CFG.ZOOM_MAX, 0, 0, 0, 0);
      panCam(999, 999); updateViewBounds();
      const bottomRight = vb.x1 === COLS - 1 && vb.y1 === ROWS - 1;
      panCam(-999, -999); updateViewBounds();
      return bottomRight && vb.x0 === 0 && vb.y0 === 0;
    })());
    resetCam();

    // ---------- save / load ----------
    head("Save and load");
    let stash = null;
    try { stash = localStorage.getItem(SAVE_KEY); } catch (e) { stash = null; }
    selfTesting = false;                       // let saveState actually write
    seedWorld();
    day = 7; dayTimer = 33.5;
    res.wood = 123; res.meal = 9;
    tiles[idx(30, 20)].bld = { kind: "fire", fuel: 42 };
    tiles[idx(31, 20)].obj = { kind: "tree", amount: 4, regrow: 0 };
    setOrder(idx(31, 20), "chop");
    reindex();
    const popBefore = settlers.length;
    const namesBefore = settlers.map(x => x.name).join(",");
    saveState();
    const loaded = loadState();
    selfTesting = true;
    ok("the save round-trips", loaded === true);
    ok("...keeping the day and clock", day === 7 && near(dayTimer, 33.5, 0.01), "day " + day);
    ok("...keeping resources", res.wood === 123 && res.meal === 9, "wood " + res.wood);
    ok("...keeping settlers", settlers.length === popBefore && settlers.map(x => x.name).join(",") === namesBefore);
    ok("...keeping buildings and their state", !!tiles[idx(30, 20)].bld && tiles[idx(30, 20)].bld.fuel === 42);
    ok("...keeping orders and scatter", tiles[idx(31, 20)].order === "chop" && !!tiles[idx(31, 20)].obj);
    ok("...and rebuilding the building index", fireIdx.includes(idx(30, 20)));
    zoomTo(2, 300, 200, 100, 100);
    const camBefore = { x: cam.x, y: cam.y, z: cam.z };
    selfTesting = false; saveState(); resetCam(); loadState(); selfTesting = true;
    ok("...and the saved view comes back",
       near(cam.z, camBefore.z, 0.001) && near(cam.x, camBefore.x, 0.01) && near(cam.y, camBefore.y, 0.01),
       "z " + cam.z + " vs " + camBefore.z);
    try { if (stash === null) localStorage.removeItem(SAVE_KEY); else localStorage.setItem(SAVE_KEY, stash); } catch (e) { /* ignore */ }

    // ---------- long run ----------
    head("Five simulated days");
    seedWorld();
    let crash = null;
    const t0 = performance.now();
    try {
      let guard = 0;
      while (day < 6 && guard++ < 40000) simulate(0.2);
    } catch (e) {
      crash = e && e.message ? e.message : String(e);
    }
    const ms = Math.round(performance.now() - t0);
    ok("five days run without throwing", crash === null, crash || "");
    ok("the day counter advanced", day >= 6, "day " + day);
    const finite = (v) => typeof v === "number" && isFinite(v);
    ok("no settler need went NaN", settlers.every(x =>
      finite(x.hunger) && finite(x.stamina) && finite(x.warmth) && finite(x.health) && finite(x.x) && finite(x.y)));
    ok("resources stayed finite and non-negative", Object.values(res).every(v => finite(v) && v >= -0.001),
      JSON.stringify(res));
    ok("every open job is still valid", jobs.every(jobValid));
    ok("settlers stayed on the map", settlers.every(x => x.x >= 0 && x.x <= COLS * TILE && x.y >= 0 && x.y <= ROWS * TILE));
    out.push("");
    out.push("  info: " + settlers.length + " settlers alive, " + deaths + " died, " +
             peakPop + " peak, " + jobs.length + " open jobs, simulated in " + ms + "ms");
    out.push("  info: newcomers arrive at dawn - population should have grown past 3 unless the cold took them");
  } catch (e) {
    fail++;
    out.push('<span class="fail">  HARNESS ERROR</span>  ' + esc(e && e.stack ? e.stack : e));
  }

  const panel = document.getElementById("selftest");
  panel.innerHTML =
    '<div style="font-family:system-ui,sans-serif;font-size:18px;font-weight:700;color:#9fe6b0">GATHER — self test</div>' +
    '<div style="color:#8b94a3;font-family:system-ui,sans-serif;font-size:13px;margin-bottom:6px">' +
    'Reload without <b>?selftest=1</b> to play. Your saved colony was left untouched.</div>' +
    out.join("\n") +
    '<div class="sum ' + (fail === 0 ? "ok" : "fail") + '">' +
    (fail === 0 ? "ALL " + pass + " CHECKS PASSED" : pass + " passed, " + fail + " FAILED") + "</div>";
  panel.classList.add("show");
  if (fail === 0) console.log("GATHER self-test: all " + pass + " checks passed");
  else console.error("GATHER self-test: " + fail + " of " + (pass + fail) + " checks failed");
}

// ===================== BOOT =====================
function init() {
  if (/[?&]selftest=1/.test(location.search)) {
    buildPalette();
    runSelfTest();
    return;
  }

  animT = 0;
  if (!loadState()) {
    speed = 1;
    seedWorld();
  }
  buildPalette();
  if (settlers.length === 0) { running = false; showOverlay(); }
  else hideOverlay();

  setSpeed(speed === 0 ? 0 : (speed || 1));
  hudDirty = true;
  updateHUD();
  requestAnimationFrame(frame);
}

init();
</script>
</body>
</html>
